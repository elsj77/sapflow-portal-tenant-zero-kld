<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renewal Portal</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --brand: #1f2937; --accent: #0ea5e9; --ink: #1c1f1d; --muted: #6b7280; --line: #e5e7eb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         color: var(--ink); background: #fafaf8; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  header img { height: 40px; width: auto; }
  header .name { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
  header .tag { color: var(--muted); font-size: 13px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 26px; margin-top: 26px;
          box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  h1 { font-size: 23px; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: 14px; }
  .state { display: none; }
  .state.on { display: block; }
  .spinner { width: 22px; height: 22px; border: 2.5px solid var(--line); border-top-color: var(--brand);
             border-radius: 50%; animation: spin .8s linear infinite; margin: 6px 0 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .closed h1 { color: #9a3412; }
  .btn { display: inline-block; background: var(--brand); color: #fff; text-decoration: none;
         padding: 11px 18px; border-radius: 10px; font-weight: 600; font-size: 15px; }
  .contact { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .contact a { color: var(--brand); }
  .who { font-size: 15px; color: var(--muted); margin: -2px 0 18px; }
  .who strong { color: var(--ink); font-weight: 600; }
  table.lines { width: 100%; border-collapse: collapse; margin: 4px 0 0; font-size: 15px; }
  table.lines th { text-align: left; font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
                   color: var(--muted); font-weight: 600; padding: 0 0 8px; border-bottom: 1px solid var(--line); }
  table.lines th.num, table.lines td.num { text-align: right; white-space: nowrap; }
  table.lines td { padding: 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.lines tr:last-child td { border-bottom: 0; }
  table.lines .svc { display: block; color: var(--muted); font-size: 13px; margin-top: 3px;
                     white-space: pre-line; line-height: 1.45; }
  .totals { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 15px; }
  .totals div { display: flex; justify-content: space-between; padding: 4px 0; }
  .totals .grand { font-weight: 700; font-size: 18px; padding-top: 8px; }
  .totals .lbl { color: var(--muted); }
  .notice { margin-top: 18px; padding: 12px 14px; background: #fff7ed; border: 1px solid #fed7aa;
            border-radius: 10px; font-size: 14px; color: #9a3412; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="logo" alt="" style="display:none">
    <div>
      <div class="name" id="tenant-name">&nbsp;</div>
      <div class="tag" id="tenant-tag"></div>
    </div>
  </header>

  <div class="card state on" id="state-checking">
    <div class="spinner"></div>
    <p class="muted">Opening your renewal&hellip;</p>
  </div>

  <div class="card state" id="state-closed">
    <div class="closed">
      <h1 id="closed-title">This portal is unavailable</h1>
      <p id="closed-message"></p>
      <div class="contact" id="closed-contact"></div>
    </div>
  </div>

  <div class="card state" id="state-ready">
    <h1 id="ready-title">Your renewal is ready</h1>
    <p class="muted" id="ready-sub"></p>
    <div id="ready-body"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var CONFIG_URL = "config.json";
  var cfg = null;

  function show(id) {
    ["state-checking", "state-closed", "state-ready"].forEach(function (s) {
      var el = document.getElementById(s);
      if (el) el.classList.toggle("on", s === id);
    });
  }

  function applyBrand(t) {
    document.documentElement.style.setProperty("--brand", t.primary_color || "#1f2937");
    document.documentElement.style.setProperty("--accent", t.accent_color || "#0ea5e9");
    if (t.display_name) document.title = t.display_name + " — Renewal";
    var n = document.getElementById("tenant-name");
    var tag = document.getElementById("tenant-tag");
    if (n) n.textContent = t.display_name || "";
    if (tag) tag.textContent = t.tagline || "";
    var logo = document.getElementById("logo");
    if (logo && t.logo_url) { logo.src = t.logo_url; logo.style.display = "block"; logo.alt = t.display_name || ""; }
  }

  function contactLine(t) {
    var parts = [];
    if (t.support_phone) parts.push('<a href="tel:' + encodeURIComponent(t.support_phone) + '">' + t.support_phone + "</a>");
    if (t.support_email) parts.push('<a href="mailto:' + encodeURIComponent(t.support_email) + '">' + t.support_email + "</a>");
    return parts.length ? "Questions? " + parts.join(" &middot; ") : "";
  }

  function closePortal(message, title) {
    var t = (cfg && cfg.tenant) || {};
    document.getElementById("closed-title").textContent = title || "This portal is unavailable";
    document.getElementById("closed-message").textContent = message || "Please contact us to continue.";
    document.getElementById("closed-contact").innerHTML = contactLine(t);
    show("state-closed");
  }

  // The gate decides. Nothing about the customer is fetched before it answers.
  // Identity is SAP's own quote code from the emailed link (?q=), not a minted token.
  function callGate(quote) {
    var g = (cfg && cfg.gate) || {};
    if (!g.url) return Promise.resolve({ allowed: false, reason: "gate_not_configured" });

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 9000);

    return fetch(g.url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // The gate needs to know WHICH tenant's SAP to resolve the quote against.
      // The slug is baked into config.json at build time, never guessed by the gate.
      body: JSON.stringify({ quote: quote, page: "renew", tenant: (cfg && cfg.gate && cfg.gate.tenant) || (cfg && cfg.tenant && cfg.tenant.slug) || "" }),
      signal: ctrl.signal
    }).then(function (r) {
      clearTimeout(timer);
      return r.json().catch(function () { return null; });
    }).then(function (data) {
      if (!data || typeof data.allowed !== "boolean") {
        return { allowed: false, reason: "gate_bad_response" };
      }
      return data;
    }).catch(function () {
      clearTimeout(timer);
      return { allowed: false, reason: "gate_unreachable" };
    });
  }

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(n) {
    return (n === null || n === undefined || isNaN(Number(n))) ? "" : "$" + Number(n).toFixed(2);
  }

  // Everything rendered here came from the gate, and the gate only returns it
  // after its access decision allowed this quote. Line labels are SAP's own
  // customer-visible EstimateNote text, never an internal note.
  function renderQuote(d) {
    show("state-ready");
    var sub = document.getElementById("ready-sub");
    var body = document.getElementById("ready-body");
    var title = document.getElementById("ready-title");
    if (title) title.textContent = d.estimate_number ? "Estimate #" + d.estimate_number : "Your renewal";

    var who = [];
    if (d.client_name) who.push("<strong>" + esc(d.client_name) + "</strong>");
    if (d.service_address) who.push(esc(d.service_address));
    if (sub) sub.innerHTML = who.length ? who.join(" &middot; ") : "";

    var html = "";
    var lines = (d.lines || []);
    if (lines.length) {
      html += '<table class="lines"><thead><tr><th>Service</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Total</th></tr></thead><tbody>';
      lines.forEach(function (l) {
        var rateCell = money(l.rate);
        if (l.visits && Number(l.visits) > 1) rateCell += " &times; " + esc(l.visits);
        html += "<tr><td>" + esc(l.label || "Service") +
                (l.detail ? '<span class="svc">' + esc(l.detail) + "</span>" : "") +
                (l.package ? '<span class="svc">Package</span>' : "") +
                "</td><td class=\"num\">" + (l.qty == null ? "" : esc(l.qty)) +
                "</td><td class=\"num\">" + rateCell +
                "</td><td class=\"num\">" + money(l.total) + "</td></tr>";
      });
      html += "</tbody></table>";

      var totals = '<div class="totals">';
      if (d.subtotal != null) totals += '<div><span class="lbl">Subtotal</span><span>' + money(d.subtotal) + "</span></div>";
      if (d.tax != null) totals += '<div><span class="lbl">GST</span><span>' + money(d.tax) + "</span></div>";
      if (d.total != null) totals += '<div class="grand"><span>Total</span><span>' + money(d.total) + "</span></div>";
      totals += "</div>";
      html += totals;
    } else if (d.lines_error) {
      html += '<div class="notice">We could not load the line items for this estimate. Please contact us and we will send it to you directly.</div>';
    } else {
      html += '<div class="notice">This estimate has no line items on file yet. Please contact us to review it.</div>';
    }

    var t = (cfg && cfg.tenant) || {};
    var contact = contactLine(t);
    if (contact) html += '<div class="contact">' + contact + "</div>";
    if (body) body.innerHTML = html;
  }

  function start() {
    // SAP's native quote link arrives as ?q=<quote code> (or the full
    // viewmyproposal URL). Both shapes carry the estimate, so both are accepted.
    var quote = new URLSearchParams(location.search).get("q") || "";
    if (!quote) {
      closePortal("This link is missing its renewal code. Use the link from your email, or contact us and we will resend it.", "Link incomplete");
      return;
    }
    callGate(quote).then(function (decision) {
      if (!decision.allowed) {
        // portalGate returns customer_message (client_message kept for older gate builds).
        closePortal(decision.customer_message || decision.client_message,
                    decision.mode === "read_only" ? "A balance is outstanding" : "This portal is closed");
        return;
      }
      // Only past this point may customer data be requested.
      renderQuote(decision);
    });
  }

  fetch(CONFIG_URL, { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      cfg = data;
      if (!cfg || !cfg.tenant) { closePortal("This portal is not configured yet. Please contact us.", "Portal unavailable"); return; }
      applyBrand(cfg.tenant);
      start();
    })
    .catch(function () {
      closePortal("We could not open the portal. Please try the link again or contact us.", "Portal unavailable");
    });
})();
</script>
</body>
</html>
