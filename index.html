<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renewal Portal</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --brand: #1f2937; --accent: #0ea5e9; --ink: #1c1f1d; --muted: #6b7280; --line: #e5e7eb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         color: var(--ink); background: #fafaf8; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  header img { height: 40px; width: auto; }
  header .name { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
  header .tag { color: var(--muted); font-size: 13px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 26px; margin-top: 26px;
          box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  h1 { font-size: 23px; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: 14px; }
  .state { display: none; }
  .state.on { display: block; }
  .spinner { width: 22px; height: 22px; border: 2.5px solid var(--line); border-top-color: var(--brand);
             border-radius: 50%; animation: spin .8s linear infinite; margin: 6px 0 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .closed h1 { color: #9a3412; }
  .btn { display: inline-block; background: var(--brand); color: #fff; text-decoration: none;
         padding: 11px 18px; border-radius: 10px; font-weight: 600; font-size: 15px; }
  .contact { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .contact a { color: var(--brand); }
  .who { font-size: 15px; color: var(--muted); margin: -2px 0 18px; }
  .who strong { color: var(--ink); font-weight: 600; }
  table.lines { width: 100%; border-collapse: collapse; margin: 4px 0 0; font-size: 15px; }
  table.lines th { text-align: left; font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
                   color: var(--muted); font-weight: 600; padding: 0 0 8px; border-bottom: 1px solid var(--line); }
  table.lines th.num, table.lines td.num { text-align: right; white-space: nowrap; }
  table.lines td { padding: 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.lines tr:last-child td { border-bottom: 0; }
  table.lines .svc { display: block; color: var(--muted); font-size: 13px; margin-top: 3px;
                     white-space: pre-line; line-height: 1.45; }
  /* A package is priced as a unit, so its parent row carries no rate or total of its
     own; the rounds SAP puts under it carry the money. Never a $0.00 here. */
  table.lines tr.pkg td { padding-bottom: 6px; }
  table.lines .pkgnote { font-style: italic; }
  table.lines tr.kid td { padding: 5px 0 5px 18px; border-bottom: 0; color: var(--ink); font-size: 14px; }
  table.lines tr.kid td:first-child { border-left: 2px solid var(--line); padding-left: 12px; }
  table.lines tr.kidlast td { border-bottom: 1px solid var(--line); padding-bottom: 11px; }
  table.lines .dash { color: var(--muted); }
  .totals { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 15px; }
  .totals div { display: flex; justify-content: space-between; padding: 4px 0; }
  .totals .grand { font-weight: 700; font-size: 18px; padding-top: 8px; }
  .totals .lbl { color: var(--muted); }
  .plans { margin-top: 22px; }
  .plans h2 { font-size: 15px; margin: 0 0 10px; letter-spacing: -0.01em; }
  .plan { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; cursor: pointer;
          background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px;
          margin-bottom: 10px; font: inherit; color: inherit; transition: border-color .15s, box-shadow .15s; }
  .plan:hover { border-color: #cbd5e1; }
  .plan[aria-checked="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(31,41,55,.06); }
  .plan .dot { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%;
               border: 2px solid #cbd5e1; }
  .plan[aria-checked="true"] .dot { border-color: var(--brand); border-width: 5px; }
  .plan .pt { font-weight: 600; }
  .plan .pd { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .plan .pp { margin-left: auto; font-weight: 650; white-space: nowrap; padding-left: 10px; }
  .acceptbar { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
  .acceptbtn { width: 100%; border: 0; border-radius: 11px; background: var(--brand); color: #fff;
               font: inherit; font-weight: 650; font-size: 16px; padding: 14px 18px; cursor: pointer; }
  .acceptbtn[disabled] { opacity: .5; cursor: not-allowed; }
  .acceptbar .fine { margin-top: 10px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .sched { margin-top: 14px; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  .sched .row { display: flex; justify-content: space-between; padding: 9px 13px; font-size: 13.5px; }
  .sched .row + .row { border-top: 1px solid var(--line); }
  .sched .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  .cardline { margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px;
    font-size: 13.5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .cardline .brand { font-weight: 650; }
  .addons { margin-top: 22px; }
  .addons h2 { font-size: 15px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .addons .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
  .addon { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; cursor: pointer;
    background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px;
    font: inherit; color: inherit; transition: border-color .15s, box-shadow .15s; }
  .addon:hover { border-color: #cbd5e1; }
  .addon[aria-checked="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(31,41,55,.06); }
  .addon[disabled] { opacity: .55; cursor: not-allowed; }
  .addon .box { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 2px; border-radius: 5px;
    border: 1.5px solid #cbd5e1; background: #fff; }
  .addon[aria-checked="true"] .box { border-color: var(--brand); background: var(--brand); }
  .addon .at { font-weight: 600; }
  .addon .ad { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .addon .ap { margin-left: auto; font-weight: 650; white-space: nowrap; padding-left: 10px; }
  .addon .why { color: #92400e; font-size: 12.5px; margin-top: 4px; }
  .change { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .change h2 { font-size: 15px; margin: 0 0 4px; }
  .change .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
  .change textarea { width: 100%; min-height: 84px; border: 1px solid var(--line); border-radius: 11px;
    padding: 12px; font: inherit; resize: vertical; }
  .change button { margin-top: 10px; border: 1px solid var(--brand); background: #fff; color: var(--brand);
    border-radius: 11px; padding: 11px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .change button[disabled] { opacity: .5; cursor: not-allowed; }

  .cardline a { color: var(--brand); font-weight: 600; }
  .terms { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-size: 13.5px; line-height: 1.5; }
  .terms input { margin-top: 3px; flex: 0 0 auto; }
  .terms a { color: var(--brand); }
  .done { margin-top: 20px; padding: 16px 18px; background: #ecfdf5; border: 1px solid #a7f3d0;
          border-radius: 12px; }
  .done .t { font-weight: 650; margin-bottom: 4px; }
  .notice { margin-top: 18px; padding: 12px 14px; background: #fff7ed; border: 1px solid #fed7aa;
            border-radius: 10px; font-size: 14px; color: #9a3412; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="logo" alt="" style="display:none">
    <div>
      <div class="name" id="tenant-name">&nbsp;</div>
      <div class="tag" id="tenant-tag"></div>
    </div>
  </header>

  <div class="card state on" id="state-checking">
    <div class="spinner"></div>
    <p class="muted">Opening your renewal&hellip;</p>
  </div>

  <div class="card state" id="state-closed">
    <div class="closed">
      <h1 id="closed-title">This portal is unavailable</h1>
      <p id="closed-message"></p>
      <div class="contact" id="closed-contact"></div>
    </div>
  </div>

  <div class="card state" id="state-ready">
    <h1 id="ready-title">Your renewal is ready</h1>
    <p class="muted" id="ready-sub"></p>
    <div id="ready-body"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var CONFIG_URL = "config.json";
  var cfg = null;

  function show(id) {
    ["state-checking", "state-closed", "state-ready"].forEach(function (s) {
      var el = document.getElementById(s);
      if (el) el.classList.toggle("on", s === id);
    });
  }

  function applyBrand(t) {
    document.documentElement.style.setProperty("--brand", t.primary_color || "#1f2937");
    document.documentElement.style.setProperty("--accent", t.accent_color || "#0ea5e9");
    if (t.display_name) document.title = t.display_name + " — Renewal";
    var n = document.getElementById("tenant-name");
    var tag = document.getElementById("tenant-tag");
    if (n) n.textContent = t.display_name || "";
    if (tag) tag.textContent = t.tagline || "";
    var logo = document.getElementById("logo");
    if (logo && t.logo_url) { logo.src = t.logo_url; logo.style.display = "block"; logo.alt = t.display_name || ""; }
  }

  function contactLine(t) {
    var parts = [];
    if (t.support_phone) parts.push('<a href="tel:' + encodeURIComponent(t.support_phone) + '">' + t.support_phone + "</a>");
    if (t.support_email) parts.push('<a href="mailto:' + encodeURIComponent(t.support_email) + '">' + t.support_email + "</a>");
    return parts.length ? "Questions? " + parts.join(" &middot; ") : "";
  }

  function closePortal(message, title) {
    var t = (cfg && cfg.tenant) || {};
    document.getElementById("closed-title").textContent = title || "This portal is unavailable";
    document.getElementById("closed-message").textContent = message || "Please contact us to continue.";
    document.getElementById("closed-contact").innerHTML = contactLine(t);
    show("state-closed");
  }

  // The gate decides. Nothing about the customer is fetched before it answers.
  // Identity is SAP's own quote code from the emailed link (?q=), not a minted token.
  function callGate(quote) {
    var g = (cfg && cfg.gate) || {};
    if (!g.url) return Promise.resolve({ allowed: false, reason: "gate_not_configured" });

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 9000);

    return fetch(g.url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // The gate needs to know WHICH tenant's SAP to resolve the quote against.
      // The slug is baked into config.json at build time, never guessed by the gate.
      body: JSON.stringify({ quote: quote, page: "renew", tenant: (cfg && cfg.gate && cfg.gate.tenant) || (cfg && cfg.tenant && cfg.tenant.slug) || "" }),
      signal: ctrl.signal
    }).then(function (r) {
      clearTimeout(timer);
      return r.json().catch(function () { return null; });
    }).then(function (data) {
      if (!data || typeof data.allowed !== "boolean") {
        return { allowed: false, reason: "gate_bad_response" };
      }
      return data;
    }).catch(function () {
      clearTimeout(timer);
      return { allowed: false, reason: "gate_unreachable" };
    });
  }

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(n) {
    return (n === null || n === undefined || isNaN(Number(n))) ? "" : "$" + Number(n).toFixed(2);
  }

  // Everything rendered here came from the gate, and the gate only returns it
  // after its access decision allowed this quote. Line labels are SAP's own
  // customer-visible EstimateNote text, never an internal note.
  function renderQuote(d) {
    show("state-ready");
    var sub = document.getElementById("ready-sub");
    var body = document.getElementById("ready-body");
    var title = document.getElementById("ready-title");
    if (title) title.textContent = d.estimate_number ? "Estimate #" + d.estimate_number : "Your renewal";

    var who = [];
    if (d.client_name) who.push("<strong>" + esc(d.client_name) + "</strong>");
    if (d.service_address) who.push(esc(d.service_address));
    if (sub) sub.innerHTML = who.length ? who.join(" &middot; ") : "";

    var html = "";
    var lines = (d.lines || []);
    if (lines.length) {
      html += '<table class="lines"><thead><tr><th>Service</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Total</th></tr></thead><tbody>';
      lines.forEach(function (l) {
        // SAP prices a package as a unit: the parent line carries Rate 0 / Total 0 and
        // its rounds carry the money. Printing that zero would tell the customer a real
        // service costs nothing, so a package parent shows the package name, a dash in
        // the money columns and its rounds underneath. The subtotal/GST/total block
        // below stays the authoritative figure.
        var kids = (l.children && l.children.length) ? l.children : [];
        if (l.priced_as_package === true) {
          var note = l.amount_note || "Priced as a package \u2014 total shown below";
          html += "<tr class=\"pkg\"><td>" + esc(l.label || "Package") +
                  (l.detail ? '<span class="svc">' + esc(l.detail) + "</span>" : "") +
                  '<span class="svc pkgnote">' + esc(note) + "</span>" +
                  "</td><td class=\"num\">" + (l.qty == null ? "" : esc(l.qty)) +
                  '</td><td class="num dash">&mdash;</td><td class="num dash">&mdash;</td></tr>';
          kids.forEach(function (c, i) {
            var cr = money(c.rate);
            if (c.visits && Number(c.visits) > 1) cr += " &times; " + esc(c.visits);
            var last = (i === kids.length - 1) ? " kidlast" : "";
            html += '<tr class="kid' + last + '"><td>' + esc(c.label || "Service") +
                    (c.detail ? '<span class="svc">' + esc(c.detail) + "</span>" : "") +
                    "</td><td class=\"num\">" + (c.qty == null ? "" : esc(c.qty)) +
                    "</td><td class=\"num\">" + cr +
                    "</td><td class=\"num\">" + money(c.total) + "</td></tr>";
          });
          return;
        }
        var rateCell = money(l.rate);
        if (l.visits && Number(l.visits) > 1) rateCell += " &times; " + esc(l.visits);
        html += "<tr><td>" + esc(l.label || "Service") +
                (l.detail ? '<span class="svc">' + esc(l.detail) + "</span>" : "") +
                "</td><td class=\"num\">" + (l.qty == null ? "" : esc(l.qty)) +
                "</td><td class=\"num\">" + rateCell +
                "</td><td class=\"num\">" + money(l.total) + "</td></tr>";
      });
      html += "</tbody></table>";

      var totals = '<div class="totals">';
      if (d.subtotal != null) totals += '<div><span class="lbl">Subtotal</span><span>' + money(d.subtotal) + "</span></div>";
      if (d.tax != null) totals += '<div><span class="lbl">GST</span><span>' + money(d.tax) + "</span></div>";
      if (d.total != null) totals += '<div class="grand"><span>Total</span><span>' + money(d.total) + "</span></div>";
      totals += "</div>";
      html += totals;
    } else if (d.lines_error) {
      html += '<div class="notice">We could not load the line items for this estimate. Please contact us and we will send it to you directly.</div>';
    } else {
      html += '<div class="notice">This estimate has no line items on file yet. Please contact us to review it.</div>';
    }

    html += plansHtml(d);

    var t = (cfg && cfg.tenant) || {};
    var contact = contactLine(t);
    if (contact) html += '<div class="contact">' + contact + "</div>";
    if (body) body.innerHTML = html;
    wirePlans(d);
    wireAddons(d);
  }

  // Installment dates. The first payment month is tenant config; default is the
  // first of next month so a schedule never reads as already overdue.
  function firstInstallmentDate() {
    var pc = (cfg && cfg.portal) || {};
    var now = new Date();
    var y = Number(pc.installments_start_year) || now.getFullYear();
    var m = Number(pc.installments_start_month) || (now.getMonth() + 2);
    if (!Number(pc.installments_start_month)) {
      if (m > 12) { m = m - 12; y = y + 1; }
    }
    return { y: y, m: m };
  }
  function addMonths(base, k) {
    var y = base.y, m = base.m + k;
    while (m > 12) { m -= 12; y += 1; }
    var names = ["January","February","March","April","May","June","July",
                 "August","September","October","November","December"];
    return { y: y, m: m, label: "1 " + names[m - 1] + " " + y };
  }

  // How the customer pays, mirroring the plans the office offers: pay in full now,
  // equal monthly payments when SAP has the estimate laid out in installments, or pay
  // as you go. Amounts come from the estimate itself, never from a template constant.
  function plansHtml(d) {
    if (!d.total) return "";
    var total = Number(d.total) || 0;
    var inst = Number(d.number_of_installments) || 0;
    var minInst = Number((cfg && cfg.portal && cfg.portal.installments_min_total) || 0);
    var plans = [];
    plans.push({ key: "prepay", title: "Pay in full", sub: "One payment for the whole renewal",
                 amount: money(total) });
    if (inst > 1 && total >= minInst) {
      plans.push({ key: "installments", title: "Equal monthly payments",
                   sub: inst + " payments of " + money(total / inst), amount: money(total / inst) + "/mo" });
    }
    plans.push({ key: "payg", title: "Pay as you go", sub: "Invoiced as the work is done",
                 amount: "" });

    var allowAccept = d.allow_accept !== false;
    var h = '<div class="plans"><h2>How would you like to pay?</h2>';
    plans.forEach(function (pl, i) {
      h += '<button type="button" class="plan" role="radio" aria-checked="' + (i === 0 ? "true" : "false") +
           '" data-plan="' + pl.key + '"><span class="dot"></span><span><span class="pt">' +
           esc(pl.title) + '</span><span class="pd">' + esc(pl.sub) + '</span></span>' +
           '<span class="pp">' + esc(pl.amount) + "</span></button>";
    });
    h += "</div>";

    // The real installment schedule, dated. A count alone tells a customer nothing
    // about when money leaves their account.
    if (inst > 1 && total >= minInst) {
      var first = firstInstallmentDate();
      var per = total / inst;
      h += '<div class="sched" id="sched" hidden>';
      for (var k = 0; k < inst; k++) {
        h += '<div class="row"><span>' + esc(addMonths(first, k).label) + '</span><span>' +
             esc(money(per)) + "</span></div>";
      }
      h += "</div>";
    }

    h += '<div class="cardline" id="cardline">Checking for a card on file…</div>';

    // Optional services. Rendered only when the tenant publishes a catalogue, and every
    // item carries the tenant's own price. A line that SAP will not accept is shown
    // disabled WITH the reason, never silently hidden and never claimed as added.
    h += '<div class="addons" id="addons" hidden><h2>Add to your renewal</h2>' +
         '<p class="sub">Optional services you can add to this season. Prices are per season.</p>' +
         '<div id="addonlist"></div></div>';

    h += '<div class="change"><h2>Need something different?</h2>' +
         '<p class="sub">Ask for a change instead of accepting and we will follow up before booking anything.</p>' +
         '<textarea id="changemsg" placeholder="Tell us what you would like changed…"></textarea>' +
         '<button type="button" id="changebtn">Send change request</button>' +
         '<div class="notice" id="changenote" hidden></div></div>';

    var terms = (cfg && cfg.terms) || {};
    var needTerms = terms.url || terms.required;
    if (needTerms) {
      h += '<label class="terms"><input type="checkbox" id="termscb"><span>I accept the ' +
           (terms.url ? '<a href="' + esc(terms.url) + '" target="_blank" rel="noopener">terms and conditions</a>'
                      : 'terms and conditions') +
           (terms.version ? " (version " + esc(terms.version) + ")" : "") + ".</span></label>";
    }

    h += '<div class="acceptbar">';
    h += '<button type="button" class="acceptbtn" id="acceptbtn"' + (allowAccept ? "" : " disabled") +
         ">" + (allowAccept ? "Accept this renewal" : "Acceptance paused") + "</button>";
    if (!allowAccept && d.customer_message) {
      h += '<div class="notice">' + esc(d.customer_message) + "</div>";
    }
    h += '<div class="fine" id="payfine">Accepting tells us to book this season at the prices shown.' +
         (d.plan_note ? " " + esc(d.plan_note) : "") + "</div>";
    h += "</div>";
    return h;
  }

  // Optional services + change request. Both talk to the tenant's own add-on endpoint with the
  // same gate approval the rest of the page uses, and both re-read SAP rather than trusting a
  // 200: an add-on that is not on the estimate was not added.
  function wireAddons(d) {
    var a = cfg && cfg.gate && cfg.gate.addon_url;
    var box = document.getElementById("addons");
    var list = document.getElementById("addonlist");
    if (!a || !list || !box) return;
    var canEdit = d.allow_accept !== false;
    var selected = {};

    function callAddon(payload) {
      return fetch(a, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({
          portal_assertion: d.payment_assertion,
          estimate_id: d.estimate_id || d.quote_id || ""
        }, payload))
      }).then(function (r) { return r.json(); });
    }

    function render() {
      list.innerHTML = "";
      callAddon({ action: "catalogue" }).then(function (res) {
        var items = (res && res.addons) || [];
        if (!items.length) { box.hidden = true; return; }
        box.hidden = false;
        items.forEach(function (it) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "addon";
          b.setAttribute("role", "checkbox");
          b.setAttribute("aria-checked", "false");
          var why = it.available === false ? (it.reason || "Not available on this estimate") : "";
          b.innerHTML = '<span class="box"></span><span><span class="at">' + esc(it.label || it.id) +
            '</span>' + (it.description ? '<span class="ad">' + esc(it.description) + '</span>' : "") +
            (why ? '<span class="why">' + esc(why) + "</span>" : "") + "</span>" +
            '<span class="ap">' + (it.rate != null ? esc(money(Number(it.rate))) : "") + "</span>";
          if (!canEdit || it.available === false) b.disabled = true;
          b.addEventListener("click", function () {
            if (b.disabled) return;
            var on = b.getAttribute("aria-checked") === "true";
            b.disabled = true;
            callAddon({ action: on ? "remove" : "add", addon_id: it.id }).then(function (r) {
              b.disabled = false;
              if (!r || r.ok !== true) {
                why = (r && (r.reason || r.detail)) || "We could not change that just now.";
                var w = b.querySelector(".why");
                if (!w) { w = document.createElement("span"); w.className = "why"; b.firstChild.appendChild(w); }
                w.textContent = why;
                return;
              }
              b.setAttribute("aria-checked", on ? "false" : "true");
              selected[it.id] = !on;
              var fine = document.getElementById("payfine");
              if (fine && r.subtotal_after != null) {
                fine.setAttribute("data-addons", String(r.subtotal_after));
              }
            });
          });
          list.appendChild(b);
        });
      }).catch(function () { box.hidden = true; });
    }

    var btn = document.getElementById("changebtn");
    var msg = document.getElementById("changemsg");
    var note = document.getElementById("changenote");
    if (btn && msg && note) {
      btn.addEventListener("click", function () {
        var text = (msg.value || "").trim();
        if (text.length < 5) {
          note.hidden = false; note.textContent = "Please describe the change you would like.";
          return;
        }
        btn.disabled = true;
        callAddon({ action: "change_request", message: text }).then(function (r) {
          btn.disabled = false;
          note.hidden = false;
          if (r && r.ok === true) {
            msg.value = "";
            note.textContent = "Thank you. Your request is with the office and nothing has been booked yet.";
          } else {
            note.textContent = (r && (r.reason || r.detail)) || "We could not send that just now.";
          }
        }).catch(function () {
          btn.disabled = false; note.hidden = false;
          note.textContent = "We could not send that just now. Please try again or call the office.";
        });
      });
    }
    render();
  }

  function wirePlans(d) {
    var chosen = "prepay";
    var card = { known: false, on_file: null, can_charge: false, add_url: null, reason: null, provider: null };

    // Ask the tenant's own processor whether this customer already has a card. The
    // answer is scoped to this quote by the gate assertion, so it cannot be used to
    // probe anyone else.
    function loadCard() {
      var g = (cfg && cfg.gate) || {};
      var line = document.getElementById("cardline");
      if (!g.pay_url) { if (line) line.textContent = ""; return; }
      fetch(g.pay_url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tenant_slug: g.tenant, action: "ask", payment_assertion: d.payment_assertion })
      }).then(function (r) { return r.json(); }).then(function (b) {
        card.known = true;
        card.provider = b.provider || null;
        card.on_file = b.card_on_file || null;
        card.can_charge = !!b.can_charge_now;
        card.add_url = b.add_card_url || null;
        card.reason = (b.can_charge && b.can_charge.reason) || b.reason || null;
        renderCard();
      }).catch(function () {
        card.known = true;
        renderCard();
      });
    }

    function renderCard() {
      var line = document.getElementById("cardline");
      if (!line) return;
      if (card.on_file && card.on_file.last4) {
        var br = card.on_file.brand ? String(card.on_file.brand) : "Card";
        var ex = card.on_file.exp ? " · expires " + esc(card.on_file.exp) : "";
        line.innerHTML = '<span class="brand">' + esc(br) + " ending " + esc(card.on_file.last4) + "</span>" +
          '<span class="muted">' + ex + "</span>";
        return;
      }
      if (card.add_url) {
        line.innerHTML = '<span class="muted">No card on file.</span>' +
          '<a href="' + esc(card.add_url) + '" target="_blank" rel="noopener">Add a card securely</a>';
        return;
      }
      line.innerHTML = '<span class="muted">No card on file. This company invoices renewals, ' +
        'so nothing is charged here.</span>';
    }

    // Show the dated schedule only while the customer is looking at that plan.
    function syncSchedule() {
      var el = document.getElementById("sched");
      if (el) el.hidden = chosen !== "installments";
      var fine = document.getElementById("payfine");
      if (fine) {
        fine.textContent = chosen === "prepay"
          ? "Accepting books this season at the prices shown. Payment is taken by the office, not on this page."
          : chosen === "installments"
            ? "Accepting books this season and sets up the dated payments shown above."
            : "Accepting books this season. You are invoiced as the work is completed.";
      }
    }
    var cards = document.querySelectorAll(".plan");
    Array.prototype.forEach.call(cards, function (el) {
      el.addEventListener("click", function () {
        chosen = el.getAttribute("data-plan") || chosen;
        Array.prototype.forEach.call(cards, function (o) {
          o.setAttribute("aria-checked", o === el ? "true" : "false");
        });
        syncSchedule();
      });
    });
    loadCard();
    syncSchedule();

    // Terms gate: the button stays shut until the customer has actually accepted them.
    var tcb = document.getElementById("termscb");
    if (tcb) {
      var syncTerms = function () {
        var b0 = document.getElementById("acceptbtn");
        if (b0) b0.disabled = d.allow_accept === false || !tcb.checked;
      };
      tcb.addEventListener("change", syncTerms);
      syncTerms();
    }
    var btn = document.getElementById("acceptbtn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var g = (cfg && cfg.gate) || {};
      if (!g.accept_url) { return; }
      btn.disabled = true;
      btn.textContent = "Accepting…";
      var terms = (cfg && cfg.terms) || {};
      fetch(g.accept_url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          portal_assertion: d.payment_assertion,
          plan: chosen,
          terms_accepted: true,
          terms_version: terms.version || null
        })
      }).then(function (r) {
        return r.json().then(function (j) { return { status: r.status, body: j }; });
      }).then(function (res) {
        var b = res.body || {};
        if (b.ok && b.accepted) {
          var bar = btn.parentNode;
          bar.innerHTML = '<div class="done"><div class="t">Thank you — your renewal is accepted.</div>' +
            '<div class="muted" id="payresult">Estimate #' + esc(b.estimate_number || "") + " · " +
            esc((b.plan || chosen)) + ". Recording how you chose to pay…</div></div>";
          settlePayment();
          bookRenewal();
          return;
        }
        btn.disabled = false;
        btn.textContent = "Accept this renewal";
        var msg = b.detail || b.error || "Something went wrong.";
        var n = document.createElement("div");
        n.className = "notice";
        n.textContent = "We could not accept this renewal just now: " + msg;
        btn.parentNode.appendChild(n);
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = "Accept this renewal";
      });
    });

    // Accepting flips the estimate's stage; booking is what actually schedules the
    // season. It is a separate call so a booking failure can never make the customer
    // believe they renewed when nothing was scheduled - and any step that needs the
    // office is reported here, in the page, not silently swallowed.
    function bookRenewal() {
      var out = document.getElementById("payresult");
      var g3 = (cfg && cfg.gate) || {};
      if (!g3.book_url) {
        if (out) out.textContent += " Our office will confirm your season booking.";
        return;
      }
      if (out) out.textContent += " Booking your season…";
      fetch(g3.book_url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ portal_assertion: d.payment_assertion })
      }).then(function (r) { return r.json(); }).then(function (j) {
        var b = j || {};
        if (b.ok) {
          if (out) out.textContent = "Your renewal is accepted and your season is booked.";
          return;
        }
        var pending = [];
        (b.steps || []).forEach(function (s) {
          if (s && s.ok === false) pending.push(String(s.step || ""));
        });
        if (out) out.textContent = "Your renewal is accepted.";
        var n = document.createElement("div");
        n.className = "notice";
        n.textContent = "Your renewal is recorded. " +
          (pending.length
            ? "One setup step still needs our office to finish it (" + pending.join(", ") + "), so your services may not be scheduled yet. We will confirm within one business day."
            : "We will confirm the scheduling within one business day.");
        if (out && out.parentNode) out.parentNode.appendChild(n);
      }).catch(function () {
        if (out) out.textContent = "Your renewal is accepted. Our office will confirm the scheduling.";
      });
    }

    // Pay in full is the only plan that moves money here, and only when the tenant's
    // own processor says it can. Anything else is reported plainly, never implied.
    function settlePayment() {
      var out = document.getElementById("payresult");
      if (!out) return;
      if (chosen !== "prepay") {
        out.textContent = chosen === "installments"
          ? "We have your schedule on file and will contact you before the first payment."
          : "You are invoiced as the work is completed. Nothing was charged.";
        return;
      }
      var g2 = (cfg && cfg.gate) || {};
      if (!card.can_charge || !g2.pay_url) {
        out.textContent = "Nothing was charged. " + (card.on_file && card.on_file.last4
          ? "We have your card ending " + card.on_file.last4 + " on file and the office will process payment."
          : "This company invoices renewals, so payment is arranged directly with the office.");
        return;
      }
      fetch(g2.pay_url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          tenant_slug: g2.tenant, action: "charge", payment_assertion: d.payment_assertion,
          amount: String(Number(d.total).toFixed(2)), currency: "CAD",
          reference: "renewal-" + (d.estimate_number || "")
        })
      }).then(function (r) { return r.json(); }).then(function (c) {
        if (c && c.money_moved) {
          out.textContent = "Payment received: " + money(Number(d.total)) +
            (c.confirmation ? " · confirmation " + c.confirmation : "") + ".";
        } else {
          out.textContent = "Nothing was charged. " +
            ((c && (c.detail || c.reason)) || "Payment could not be taken just now") +
            ". The office will follow up.";
        }
      }).catch(function () {
        out.textContent = "Nothing was charged. The office will follow up about payment.";
      });
    }
  }

  function start() {
    // SAP's native quote link arrives as ?q=<quote code> (or the full
    // viewmyproposal URL). Both shapes carry the estimate, so both are accepted.
    var quote = new URLSearchParams(location.search).get("q") || "";
    if (!quote) {
      closePortal("This link is missing its renewal code. Use the link from your email, or contact us and we will resend it.", "Link incomplete");
      return;
    }
    callGate(quote).then(function (decision) {
      if (!decision.allowed) {
        // portalGate returns customer_message (client_message kept for older gate builds).
        closePortal(decision.customer_message || decision.client_message,
                    decision.mode === "read_only" ? "A balance is outstanding" : "This portal is closed");
        return;
      }
      // Only past this point may customer data be requested.
      renderQuote(decision);
    });
  }

  fetch(CONFIG_URL, { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      cfg = data;
      if (!cfg || !cfg.tenant) { closePortal("This portal is not configured yet. Please contact us.", "Portal unavailable"); return; }
      applyBrand(cfg.tenant);
      start();
    })
    .catch(function () {
      closePortal("We could not open the portal. Please try the link again or contact us.", "Portal unavailable");
    });
})();
</script>
